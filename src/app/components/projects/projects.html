<section id="projects" class="projects">
  <div class="container">
    <h2 class="section-title">Featured Projects</h2>
    <div class="projects-grid">
      @for (project of projects; track project.id; let index = $index) {
        <div #projectCard class="project-card" [style.--card-progress]="cardReveal(index)">
          <div class="project-image" [class.project-image--compact]="project.id === 1 || project.id === 2 || project.id === 3">
            <img src="{{ project.image }}" alt="{{ project.title }} screenshot" />
          </div>
          <div class="project-header">
            <h3 class="project-title">{{ project.title }}</h3>
          </div>
          <p class="project-description">{{ project.description }}</p>
          <div class="project-tech">
            @for (tech of project.technologies; track tech) {
              <span class="tech-tag">{{ tech }}</span>
            }
          </div>
          <div class="project-links">
            <a href="{{ project.link }}" class="project-link" aria-label="View project" target="_blank" rel="noopener noreferrer">
              View Project
            </a>
            <a href="{{ project.github }}" class="project-icon-link" aria-label="View on GitHub" target="_blank" rel="noopener noreferrer">
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 0.297c-6.626 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577v-2.234c-3.338.726-4.033-1.415-4.033-1.415-.546-1.387-1.333-1.757-1.333-1.757-1.09-.745.083-.73.083-.73 1.205.084 1.84 1.238 1.84 1.238 1.07 1.835 2.809 1.305 3.495.998.108-.775.418-1.305.76-1.605-2.665-.303-5.466-1.332-5.466-5.931 0-1.31.468-2.381 1.235-3.221-.123-.303-.536-1.523.117-3.176 0 0 1.008-.322 3.3 1.23.957-.266 1.98-.399 3-.405 1.02.006 2.043.139 3 .405 2.289-1.552 3.294-1.23 3.294-1.23.656 1.653.243 2.873.12 3.176.77.84 1.232 1.911 1.232 3.221 0 4.61-2.805 5.625-5.475 5.922.43.37.813 1.102.813 2.222v3.293c0 .322.218.694.825.576 4.765-1.589 8.2-6.085 8.2-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
            </a>
          </div>
        </div>
      }
    </div>
  </div>
</section>
